<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>deptree</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
    background: #f0f2f5;
  }

  /* ── Sidebar ── */
  #sidebar {
    width: 240px;
    min-width: 240px;
    background: #1e1e2e;
    color: #cdd6f4;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #sidebar-header {
    padding: 18px 16px 14px;
    border-bottom: 1px solid #313244;
  }
  #sidebar-header h1 {
    font-size: 18px;
    font-weight: 700;
    color: #cba6f7;
    letter-spacing: 1px;
  }
  #sidebar-header p { font-size: 11px; color: #6c7086; margin-top: 2px; }

  #sidebar-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px 0;
  }

  .filter-section { padding: 8px 16px; }
  .filter-section h3 {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #6c7086;
    margin-bottom: 8px;
  }

  .filter-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    cursor: pointer;
    user-select: none;
  }
  .filter-item:hover { color: #cba6f7; }

  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .filter-item input[type=checkbox] {
    accent-color: #cba6f7;
    width: 14px; height: 14px;
    cursor: pointer;
  }

  .filter-item label {
    font-size: 12px;
    cursor: pointer;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .divider { height: 1px; background: #313244; margin: 8px 0; }

  #sidebar-actions { padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }

  button {
    padding: 7px 12px;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  button:hover { opacity: .85; }

  .btn-primary { background: #cba6f7; color: #1e1e2e; }
  .btn-secondary { background: #313244; color: #cdd6f4; }

  /* ── Detail panel (slides up from bottom of sidebar) ── */
  #detail {
    padding: 12px 16px;
    border-top: 1px solid #313244;
    font-size: 12px;
    display: none;
  }
  #detail h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #6c7086; margin-bottom: 8px; }
  #detail-name { font-size: 14px; font-weight: 600; color: #cba6f7; margin-bottom: 4px; word-break: break-all; }
  #detail-label { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-bottom: 8px; }
  #detail-stats { color: #a6adc8; }
  #detail-stats span { display: block; margin: 2px 0; }

  /* ── Main area ── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Topbar ── */
  #topbar {
    background: #fff;
    border-bottom: 1px solid #e2e8f0;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  #search {
    flex: 1;
    max-width: 320px;
    padding: 6px 12px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    font-size: 13px;
    outline: none;
    transition: border-color .15s;
  }
  #search:focus { border-color: #cba6f7; }

  #stats {
    margin-left: auto;
    font-size: 12px;
    color: #94a3b8;
    white-space: nowrap;
  }

  .layout-btn {
    padding: 5px 10px;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    background: #fff;
    color: #64748b;
    font-size: 12px;
  }
  .layout-btn.active { background: #1e1e2e; color: #cba6f7; border-color: #1e1e2e; }

  /* ── Graph ── */
  #cy {
    flex: 1;
    background: #f8fafc;
  }

  /* ── Loading overlay ── */
  #loading {
    position: absolute;
    inset: 0;
    background: rgba(248,250,252,.9);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #64748b;
    pointer-events: none;
  }
  #loading.hidden { display: none; }
</style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <div id="sidebar-header">
    <h1>deptree</h1>
    <p id="subtitle">dependency graph</p>
  </div>

  <div id="sidebar-body">
    <div class="filter-section" id="system-section" style="display:none">
      <h3>Systems</h3>
      <div id="system-filters"></div>
    </div>
    <div class="divider" id="system-divider" style="display:none"></div>
    <div class="filter-section">
      <h3>Node Types</h3>
      <div id="label-filters"></div>
    </div>
    <div class="divider"></div>
    <div class="filter-section">
      <h3>Relationships</h3>
      <div id="rel-filters"></div>
    </div>
  </div>

  <div id="sidebar-actions">
    <button class="btn-primary" onclick="applyFilters()">Apply filters</button>
    <button class="btn-secondary" onclick="resetFilters()">Reset</button>
    <button class="btn-secondary" onclick="fitGraph()">Fit all</button>
  </div>

  <div id="detail">
    <h3>Selected node</h3>
    <div id="detail-name"></div>
    <div id="detail-label"></div>
    <div id="detail-stats"></div>
  </div>
</div>

<!-- Main -->
<div id="main">
  <div id="topbar">
    <input id="search" type="text" placeholder="Search nodes…" oninput="searchNodes(this.value)">
    <button class="layout-btn active" id="btn-dagre" onclick="changeLayout('dagre')">Hierarchy</button>
    <button class="layout-btn" id="btn-cose" onclick="changeLayout('cose')">Force</button>
    <div id="stats"></div>
  </div>
  <div id="cy"></div>
  <div id="loading">Loading graph…</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.29.2/cytoscape.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.min.js"></script>
<script>
cytoscape.use(cytoscapeDagre);

// ── Color palette ────────────────────────────────────────────
const LABEL_COLORS = {
  APPLICATION: '#F1C40F',
  ENTITY:      '#4A90D9',
  TABLE:       '#27AE60',
  REPOSITORY:  '#9B59B6',
  QUERY:       '#E67E22',
  PROCEDURE:   '#E74C3C',
  VIEW:        '#16A085',
  PACKAGE:     '#D35400',
  SYNONYM:     '#7F8C8D',
  TYPE:        '#8E44AD',
};
const DEFAULT_COLOR = '#95A5A6';

const REL_COLORS = {
  STORED_IN:  '#27AE60',
  MANAGES:    '#9B59B6',
  QUERIES:    '#E67E22',
  USES_TABLE: '#4A90D9',
  DEPENDS_ON:   '#E74C3C',
  CALLS:        '#E91E63',
  CONTAINS:     '#F1C40F',
  ONE_TO_MANY:  '#1ABC9C',
  MANY_TO_ONE:  '#2ECC71',
  MANY_TO_MANY: '#3498DB',
  ONE_TO_ONE:   '#9B59B6',
};
const DEFAULT_REL_COLOR = '#94a3b8';

function nodeColor(label) { return LABEL_COLORS[label] || DEFAULT_COLOR; }
function edgeColor(rel)   { return REL_COLORS[rel]   || DEFAULT_REL_COLOR; }

// ── State ────────────────────────────────────────────────────
let cy, allNodes = [], allEdges = [], currentLayout = 'dagre';
let activeLabels = new Set(), activeRels = new Set(), activeSystems = new Set();

// ── Boot ─────────────────────────────────────────────────────
async function boot() {
  const [meta, graph] = await Promise.all([
    fetch('/api/meta').then(r => r.json()),
    fetch('/api/graph').then(r => r.json()),
  ]);

  allNodes = graph.nodes || [];
  allEdges = graph.edges || [];

  activeLabels  = new Set(meta.labels  || []);
  activeRels    = new Set(meta.rels    || []);
  activeSystems = new Set(meta.systems || []);

  // Show systems section only when there are systems tagged
  if ((meta.systems || []).length > 0) {
    document.getElementById('system-section').style.display = '';
    document.getElementById('system-divider').style.display = '';
    buildSystemFilterUI(meta.systems);
  }

  buildFilterUI('label-filters', meta.labels || [], activeLabels, true);
  buildFilterUI('rel-filters',   meta.rels   || [], activeRels,   false);

  initCy(allNodes, allEdges);
  document.getElementById('loading').classList.add('hidden');
  updateStats();
}

// ── System filter UI ─────────────────────────────────────────
const SYSTEM_COLORS = ['#cba6f7','#89b4fa','#a6e3a1','#fab387','#f38ba8','#f9e2af'];
function systemColor(i) { return SYSTEM_COLORS[i % SYSTEM_COLORS.length]; }

function buildSystemFilterUI(systems) {
  const container = document.getElementById('system-filters');
  container.innerHTML = '';
  systems.forEach((sys, i) => {
    const div = document.createElement('div');
    div.className = 'filter-item';

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.id = 'sys-' + sys;
    cb.checked = true;
    cb.dataset.value = sys;

    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = systemColor(i);

    const label = document.createElement('label');
    label.htmlFor = cb.id;
    label.textContent = sys;

    div.appendChild(cb);
    div.appendChild(dot);
    div.appendChild(label);
    container.appendChild(div);
  });
}

// ── Filter UI ────────────────────────────────────────────────
function buildFilterUI(containerId, items, activeSet, isLabel) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'filter-item';

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.id = containerId + '-' + item;
    cb.checked = activeSet.has(item);
    cb.dataset.value = item;
    cb.dataset.type = isLabel ? 'label' : 'rel';

    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = isLabel ? nodeColor(item) : edgeColor(item);

    const label = document.createElement('label');
    label.htmlFor = cb.id;
    label.textContent = item;

    div.appendChild(cb);
    div.appendChild(dot);
    div.appendChild(label);
    container.appendChild(div);
  });
}

// applyFilters — pure client-side: no round-trip to the server.
// Nodes are shown only if their label AND system match the selected checkboxes.
// Edges are shown only if their rel is selected AND both endpoints are visible.
function applyFilters() {
  const selLabels  = checkedValues('#label-filters');
  const selRels    = checkedValues('#rel-filters');
  const selSystems = checkedValues('#system-filters');

  // Determine visible node IDs
  const visibleIds = new Set();
  allNodes.forEach(n => {
    const labelOk  = selLabels.size === 0  || selLabels.has(n.label);
    const systemOk = selSystems.size === 0 || !n.system || selSystems.has(n.system);
    if (labelOk && systemOk) visibleIds.add(n.id);
  });

  const nodes = allNodes.filter(n => visibleIds.has(n.id));
  const edges = allEdges.filter(e =>
    visibleIds.has(e.source) &&
    visibleIds.has(e.target) &&
    (selRels.size === 0 || selRels.has(e.rel))
  );

  initCy(nodes, edges);
  updateStats();
}

function resetFilters() {
  document.querySelectorAll('#label-filters input, #rel-filters input, #system-filters input')
    .forEach(cb => { cb.checked = true; });
  applyFilters();
}

function checkedValues(selector) {
  const s = new Set();
  document.querySelectorAll(selector + ' input:checked').forEach(cb => s.add(cb.dataset.value));
  return s;
}

// ── Cytoscape ────────────────────────────────────────────────
function initCy(nodes, edges) {
  if (cy) cy.destroy();

  const elements = [
    ...nodes.map(n => ({
      group: 'nodes',
      data: { id: n.id, label: n.label, name: n.name || n.id },
    })),
    ...edges.map((e, i) => ({
      group: 'edges',
      data: { id: 'e' + i, source: e.source, target: e.target, rel: e.rel },
    })),
  ];

  cy = cytoscape({
    container: document.getElementById('cy'),
    elements,
    style: [
      {
        selector: 'node',
        style: {
          'label': 'data(name)',
          'background-color': ele => nodeColor(ele.data('label')),
          'color': '#fff',
          'text-valign': 'center',
          'text-halign': 'center',
          'font-size': '10px',
          'font-weight': '600',
          'text-wrap': 'wrap',
          'text-max-width': '90px',
          'width': 'label',
          'height': 'label',
          'padding': '10px',
          'border-width': 0,
          'shape': 'round-rectangle',
          'text-outline-color': ele => nodeColor(ele.data('label')),
          'text-outline-width': 0,
        },
      },
      {
        selector: 'node:selected',
        style: {
          'border-width': 3,
          'border-color': '#cba6f7',
          'border-opacity': 1,
        },
      },
      {
        selector: 'node.faded',
        style: { opacity: 0.2 },
      },
      {
        selector: 'edge',
        style: {
          'label': 'data(rel)',
          'font-size': '9px',
          'color': '#64748b',
          'text-background-color': '#f8fafc',
          'text-background-opacity': 1,
          'text-background-padding': '2px',
          'line-color': ele => edgeColor(ele.data('rel')),
          'target-arrow-color': ele => edgeColor(ele.data('rel')),
          'target-arrow-shape': 'triangle',
          'curve-style': 'bezier',
          'width': 1.5,
          'arrow-scale': 0.8,
        },
      },
      {
        selector: 'edge.faded',
        style: { opacity: 0.08 },
      },
    ],
    layout: layoutConfig(currentLayout),
    wheelSensitivity: 0.3,
  });

  cy.on('tap', 'node', e => showDetail(e.target));
  cy.on('tap', e => { if (e.target === cy) clearDetail(); });
}

function layoutConfig(name) {
  if (name === 'dagre') {
    return {
      name: 'dagre',
      rankDir: 'LR',
      nodeSep: 40,
      rankSep: 80,
      padding: 30,
      animate: false,
    };
  }
  return {
    name: 'cose',
    animate: true,
    animationDuration: 500,
    nodeRepulsion: 4096,
    idealEdgeLength: 100,
    padding: 30,
  };
}

function changeLayout(name) {
  currentLayout = name;
  document.querySelectorAll('.layout-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + name).classList.add('active');
  if (cy) cy.layout(layoutConfig(name)).run();
}

function fitGraph() {
  if (cy) cy.fit(undefined, 30);
}

// ── Search ───────────────────────────────────────────────────
function searchNodes(q) {
  if (!cy) return;
  if (!q) {
    cy.nodes().removeClass('faded');
    cy.edges().removeClass('faded');
    return;
  }
  const lower = q.toLowerCase();
  cy.nodes().forEach(n => {
    const match = n.data('name').toLowerCase().includes(lower)
                || n.data('id').toLowerCase().includes(lower);
    n.toggleClass('faded', !match);
  });
  cy.edges().addClass('faded');
}

// ── Detail panel ─────────────────────────────────────────────
function showDetail(node) {
  const panel = document.getElementById('detail');
  const inDeg  = node.indegree();
  const outDeg = node.outdegree();

  document.getElementById('detail-name').textContent = node.data('name') || node.data('id');

  const labelEl = document.getElementById('detail-label');
  labelEl.textContent = node.data('label');
  labelEl.style.background = nodeColor(node.data('label')) + '33';
  labelEl.style.color = nodeColor(node.data('label'));
  labelEl.style.border = '1px solid ' + nodeColor(node.data('label'));

  document.getElementById('detail-stats').innerHTML =
    `<span>↑ ${outDeg} outgoing</span><span>↓ ${inDeg} incoming</span>`;

  panel.style.display = 'block';

  // Highlight neighbourhood
  cy.nodes().addClass('faded');
  cy.edges().addClass('faded');
  node.removeClass('faded');
  node.connectedEdges().removeClass('faded').connectedNodes().removeClass('faded');
}

function clearDetail() {
  document.getElementById('detail').style.display = 'none';
  if (cy) {
    cy.nodes().removeClass('faded');
    cy.edges().removeClass('faded');
  }
}

function updateStats() {
  const n = cy ? cy.nodes().length : 0;
  const e = cy ? cy.edges().length : 0;
  document.getElementById('stats').textContent = `${n} nodes · ${e} edges`;
}

boot();
</script>
</body>
</html>
