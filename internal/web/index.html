<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>deptree</title>
<style>
/* ── Reset & base ────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 13px;
  background: #0f172a;
  color: #cbd5e1;
  overflow: hidden;
}

/* ── Layout ──────────────────────────────────────────────────── */
.app { display: flex; flex-direction: column; height: 100vh; }
.workspace { display: flex; flex: 1; overflow: hidden; }
.canvas-area { position: relative; flex: 1; display: flex; overflow: hidden; }

/* ── Topbar ──────────────────────────────────────────────────── */
.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
  height: 52px;
  background: #1e293b;
  border-bottom: 1px solid #334155;
  flex-shrink: 0;
  z-index: 20;
}
.topbar-logo {
  font-size: 16px;
  font-weight: 700;
  color: #818cf8;
  letter-spacing: 1px;
  flex-shrink: 0;
}
.topbar-stats {
  margin-left: auto;
  color: #64748b;
  font-size: 12px;
  white-space: nowrap;
}

/* ── Search ──────────────────────────────────────────────────── */
.topbar-search {
  flex: 1;
  max-width: 480px;
  position: relative;
}
.search-input-wrap {
  display: flex;
  align-items: center;
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 8px;
  padding: 0 12px;
  height: 34px;
  gap: 8px;
  transition: border-color .15s;
}
.search-input-wrap:focus-within { border-color: #818cf8; }
.search-icon { color: #64748b; font-size: 16px; }
.search-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: #e2e8f0;
  font-size: 13px;
}
.search-input::placeholder { color: #475569; }
.search-spinner { color: #64748b; font-size: 11px; }
.search-dropdown {
  position: absolute;
  top: calc(100% + 4px);
  left: 0; right: 0;
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 8px;
  overflow: hidden;
  list-style: none;
  z-index: 100;
  box-shadow: 0 8px 24px rgba(0,0,0,.4);
}
.search-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  cursor: pointer;
  transition: background .1s;
}
.search-item:hover { background: #334155; }
.search-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.search-name { flex: 1; color: #e2e8f0; font-weight: 500; }
.search-label {
  font-size: 10px;
  color: #64748b;
  background: #0f172a;
  padding: 2px 6px;
  border-radius: 4px;
}
.search-system { font-size: 10px; color: #818cf8; }

/* ── Sidebar ──────────────────────────────────────────────────── */
.sidebar {
  width: 220px;
  min-width: 220px;
  background: #1e293b;
  border-right: 1px solid #334155;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 0;
}
.sidebar-section { padding: 12px 14px; }
.sidebar-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: #475569;
  margin-bottom: 8px;
}
.sidebar-label-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}
.sidebar-label-row .sidebar-label { margin-bottom: 0; flex: 1; }
.sidebar-toggle {
  font-size: 10px;
  color: #475569;
  cursor: pointer;
  text-decoration: underline;
}
.sidebar-toggle:hover { color: #818cf8; }
.sidebar-hint { font-size: 11px; color: #475569; margin-top: 8px; line-height: 1.4; }
.sidebar-divider { height: 1px; background: #334155; }

/* ── Direction buttons ───────────────────────────────────────── */
.dir-group { display: flex; gap: 6px; }
.dir-btn {
  flex: 1;
  padding: 6px;
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 6px;
  color: #94a3b8;
  font-size: 16px;
  cursor: pointer;
  transition: all .15s;
}
.dir-btn:hover { border-color: #818cf8; color: #818cf8; }
.dir-btn.active { background: #818cf8; border-color: #818cf8; color: #0f172a; font-weight: 700; }

/* ── Depth buttons ───────────────────────────────────────────── */
.depth-group { display: flex; gap: 4px; }
.depth-btn {
  flex: 1;
  padding: 5px;
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 6px;
  color: #94a3b8;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
}
.depth-btn:hover { border-color: #818cf8; color: #818cf8; }
.depth-btn.active { background: #818cf8; border-color: #818cf8; color: #0f172a; }

/* ── Filters ─────────────────────────────────────────────────── */
.filter-item {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 3px 0;
  cursor: pointer;
  user-select: none;
}
.filter-item input { accent-color: #818cf8; width: 13px; height: 13px; cursor: pointer; }
.filter-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.filter-name { font-size: 12px; color: #cbd5e1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── Detail Panel ────────────────────────────────────────────── */
.detail-panel {
  width: 240px;
  min-width: 240px;
  background: #1e293b;
  border-left: 1px solid #334155;
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
}
.detail-header { display: flex; align-items: center; justify-content: space-between; }
.detail-badge {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
}
.detail-close {
  background: none;
  border: none;
  color: #64748b;
  font-size: 20px;
  cursor: pointer;
  line-height: 1;
  padding: 0;
}
.detail-close:hover { color: #e2e8f0; }
.detail-name {
  font-size: 15px;
  font-weight: 600;
  color: #e2e8f0;
  word-break: break-all;
  line-height: 1.3;
}
.detail-id { font-size: 10px; color: #475569; word-break: break-all; }
.detail-system { font-size: 11px; color: #818cf8; }
.detail-stats { display: flex; gap: 8px; }
.stat-box {
  flex: 1;
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 8px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.stat-num { font-size: 20px; font-weight: 700; color: #818cf8; }
.stat-lbl { font-size: 10px; color: #64748b; }
.detail-actions { display: flex; flex-direction: column; gap: 6px; }

/* ── Detail properties table ──────────────────────────────────── */
.detail-divider { height: 1px; background: #334155; }
.detail-props-loading { font-size: 11px; color: #475569; text-align: center; padding: 4px 0; }
.detail-props { width: 100%; border-collapse: collapse; }
.detail-props td { padding: 4px 0; vertical-align: top; }
.prop-key {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: #475569;
  width: 80px;
  padding-right: 8px;
}
.prop-val { font-size: 12px; color: #cbd5e1; word-break: break-all; }

/* ── Buttons ─────────────────────────────────────────────────── */
button { cursor: pointer; font-family: inherit; transition: opacity .15s; }
button:hover { opacity: .85; }
.btn-primary {
  background: #818cf8;
  color: #0f172a;
  border: none;
  border-radius: 7px;
  padding: 8px 14px;
  font-size: 12px;
  font-weight: 600;
}
.btn-secondary {
  background: #1e293b;
  color: #94a3b8;
  border: 1px solid #334155;
  border-radius: 7px;
  padding: 8px 14px;
  font-size: 12px;
}
.ctrl-btn {
  background: #1e293b;
  color: #94a3b8;
  border: 1px solid #334155;
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 11px;
}
.ctrl-btn:hover { border-color: #818cf8; color: #818cf8; }

/* ── Empty state ────────────────────────────────────────────── */
.empty-state {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: #475569;
  pointer-events: none;
  z-index: 5;
}
.empty-state > * { pointer-events: auto; }
.empty-icon { font-size: 48px; color: #334155; }
.empty-state h2 { font-size: 16px; color: #64748b; font-weight: 600; }
.empty-state p  { font-size: 13px; color: #475569; text-align: center; max-width: 280px; }

/* ── Overlay messages ────────────────────────────────────────── */
.overlay-msg {
  position: absolute;
  top: 12px; left: 50%;
  transform: translateX(-50%);
  background: #334155;
  color: #cbd5e1;
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 12px;
  z-index: 30;
  pointer-events: none;
}
.overlay-msg.error { background: #7f1d1d; color: #fca5a5; }

/* ── Scrollbar ───────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>
</head>
<body>
<div id="root"></div>

<!-- Import map: React + htm (no build step) -->
<script type="importmap">
{
  "imports": {
    "react":            "https://esm.sh/react@18.3.1",
    "react-dom":        "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "htm":              "https://esm.sh/htm@3.1.1",
    "htm/react":        "/html.js"
  }
}
</script>

<!-- Cytoscape + dagre layout (loaded globally before modules) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.29.2/cytoscape.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.min.js"></script>
<script>
  // Register dagre layout with cytoscape
  if (window.cytoscape && window.cytoscapeDagre) {
    cytoscape.use(cytoscapeDagre);
  }
</script>

<!-- App entry point -->
<script type="module">
  import { createRoot } from 'react-dom/client';
  import { html } from 'htm/react';
  import App from './App.js';

  createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
